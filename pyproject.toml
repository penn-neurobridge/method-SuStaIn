[project]
name = "method-sustain"
version = "0.1.0"
description = "SuStaIn analysis pipeline — disease subtype and staging inference from biomarker data"
requires-python = ">=3.10"

dependencies = [
    # Core scientific computing
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",

    # Plotting
    "matplotlib>=3.8",

    # CLI framework (makes the --help flags and --input arguments work)
    "typer>=0.12",

    # NOTE: pySuStaIn is not on PyPI — install it separately from GitHub:
    #   pip install "git+https://github.com/ucl-pond/pySuStaIn.git"
    # The pipeline runs in demo mode if pySuStaIn is not installed.
]

[project.scripts]
# After `uv sync`, you can also run the pipeline as:  uv run run-analysis --input ...
run-analysis = "codes.run_analysis:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codes"]

[tool.uv]
# Pin the index so the lock file is fully reproducible
index-url = "https://pypi.org/simple"
