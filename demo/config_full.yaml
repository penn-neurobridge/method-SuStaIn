# Full profile: the settings used in the SuStaIn papers. Expect HOURS, not minutes:
# the journal-club notebook measured ~4 min for 5 start points / 10 000 MCMC / 3 subtypes on
# 400 x 4 data, and 2-fold CV took ~7 min more. Run this one overnight (or on a cluster).

data:
  id_column: subject_id
  group_column: group            # null -> no groups (needs an explicit direction and a mixture model)
  control_label: control         # value in group_column meaning "healthy control"
  biomarker_columns: auto        # auto = every numeric column not listed above/below; or a list
  covariate_columns: [age]       # regressed out (fitted on controls, applied to everyone); [] to disable
  missing: error                 # error | drop_rows | model (z-score only; pySuStaIn's missing-data model)

preprocess:
  direction: auto                # auto | increasing | decreasing | {A: increasing, D: decreasing}
                                 # "auto" flips any biomarker whose patients sit below the controls
  clip_z: 10                     # |z| clipped here; extreme values underflow pySuStaIn's likelihood

model:
  type: auto                     # auto | zscore | mixture_unsupervised | mixture_gmm | mixture_kde
                                 # auto = zscore when a control group exists, else mixture_unsupervised
  thresholds:                    # z-score models only
    mode: fixed                  # fixed | auto (auto derives z_vals from patient quantiles)
    z_vals: [1, 2, 3]            # one list for every biomarker, or {A: [1, 2, 3], D: [1, 2]}
    z_max: 5                     # scalar or per-biomarker mapping
    n_levels: 3                  # auto mode: thresholds per biomarker
    min_fraction_above_top: 0.05 # >5 % of patients must exceed the top threshold (Taylor et al. 2024)
    strict: false                # fixed mode: fail (true) or warn (false) when that rule is violated

fit:
  n_startpoints: 25
  n_subtypes_max: 3              # models with 1..3 subtypes are fitted
  n_mcmc: 100000                 # write the number out; YAML reads 1e5 as text
  seed: 1
  parallel: true                 # use all CPU cores for the start points
  n_posterior_samples: 1000

cv:
  enabled: true
  n_folds: 10
  seed: 0

output:
  dataset_name: demo             # prefix of pySuStaIn's pickle files
  plots: true
